<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Quack AR — rotating duck</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Must NOT be opaque black — camera <video> sits behind the canvas */
        background: transparent;
      }
      a-scene {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* Transparent WebGL so camera feed shows through */
      .a-canvas, canvas.a-canvas, a-scene canvas {
        background: transparent !important;
        display: block !important;
        width: 100% !important;
        height: 100% !important;
      }
      /*
        MindAR injects <video> for the camera.
        Keep it visible under the transparent canvas — never z-index < 0
        (that hides it behind the page background).
      */
      video {
        display: block !important;
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        z-index: 0 !important;
        opacity: 1 !important;
        visibility: visible !important;
        background: #000;
      }
      a-scene > .a-canvas,
      a-scene canvas {
        position: absolute !important;
        inset: 0 !important;
        z-index: 1 !important;
      }
      #start {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: linear-gradient(160deg, #1a3a5c, #264653 50%, #2a9d8f);
        color: #fff8f0;
        font-family: Georgia, "Times New Roman", serif;
      }
      #start h1 { margin: 0; font-size: 1.8rem; font-weight: normal; }
      #start p { margin: 0; max-width: 22rem; opacity: 0.9; line-height: 1.4; }
      #start button {
        margin-top: 0.5rem;
        border: 0;
        border-radius: 999px;
        padding: 0.9rem 1.6rem;
        font-size: 1.1rem;
        cursor: pointer;
        background: #ffb703;
        color: #264653;
        font-weight: 700;
      }
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 1rem;
        z-index: 20;
        text-align: center;
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 0.9rem;
        text-shadow: 0 1px 4px #000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #hint.show { opacity: 1; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="start">
      <h1>Quack AR</h1>
      <p>Нажмите «Начать», разрешите камеру и наведите телефон на распечатанную открытку.</p>
      <button type="button" id="startBtn">Начать</button>
    </div>
    <div id="hint">Ищем открытку…</div>

    <a-scene
      id="scene"
      mindar-image="imageTargetSrc: ./assets/targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; uiLoading: no; uiScanning: no; uiError: yes"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      loading-screen="enabled: false"
      background="transparent: true; color: #00000000"
    >
      <a-assets>
        <a-asset-item id="duckModel" src="./assets/duck.glb"></a-asset-item>
        <audio id="track" src="./assets/duck-quack.mp3" preload="auto" loop playsinline></audio>
      </a-assets>

      <a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>
      <a-light type="directional" color="#ffffff" intensity="1.1" position="1 2 1"></a-light>
      <a-light type="directional" color="#ffe6c0" intensity="0.55" position="-1 1 -0.5"></a-light>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!--
        MindAR target: XY = postcard plane, Z toward camera.
        Khronos Duck is Y-up in glTF → rotate +90° around X so it stands on the postcard.
        Spin around local "up" after that (world Z / postcard normal) via wrapper.
      -->
      <a-entity id="anchor" mindar-image-target="targetIndex: 0">
        <a-entity
          id="duckSpin"
          position="0 0 0.12"
          animation="property: rotation; to: 0 0 360; loop: true; dur: 6000; easing: linear"
        >
          <a-gltf-model
            id="duck"
            src="#duckModel"
            rotation="90 0 0"
            scale="0.5 0.5 0.5"
          ></a-gltf-model>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const startEl = document.getElementById("start");
      const startBtn = document.getElementById("startBtn");
      const sceneEl = document.getElementById("scene");
      const hintEl = document.getElementById("hint");
      const audioEl = document.getElementById("track");
      const anchor = document.getElementById("anchor");

      let audioReady = false;

      function ensureCameraVisible() {
        // MindAR may append video to body or scene — keep it under transparent canvas
        document.querySelectorAll("video").forEach((v) => {
          v.style.zIndex = "0";
          v.style.opacity = "1";
          v.style.visibility = "visible";
          v.style.objectFit = "cover";
          v.setAttribute("playsinline", "");
          v.setAttribute("webkit-playsinline", "");
          v.muted = true; // camera preview must stay muted for autoplay policies
          v.play().catch(() => {});
        });
        const canvas = document.querySelector("a-scene canvas, canvas.a-canvas");
        if (canvas) {
          canvas.style.background = "transparent";
          canvas.style.zIndex = "1";
        }
        // Transparent clear color for Three.js renderer
        try {
          const renderer = sceneEl.renderer;
          if (renderer) {
            renderer.setClearColor(0x000000, 0);
            renderer.setClearAlpha(0);
          }
        } catch (e) { /* ignore */ }
        window.dispatchEvent(new Event("resize"));
      }

      sceneEl.addEventListener("loaded", () => {
        ensureCameraVisible();
        setTimeout(ensureCameraVisible, 200);
      });

      startBtn.addEventListener("click", async () => {
        startEl.classList.add("hidden");
        hintEl.classList.add("show");

        try {
          audioEl.currentTime = 0;
          await audioEl.play();
          audioEl.pause();
          audioReady = true;
        } catch (e) {
          console.warn("audio unlock failed", e);
        }

        ensureCameraVisible();
        setTimeout(ensureCameraVisible, 300);
        setTimeout(ensureCameraVisible, 1000);
      });

      anchor.addEventListener("targetFound", async () => {
        hintEl.textContent = "Утка найдена";
        ensureCameraVisible();
        if (audioReady) {
          try { await audioEl.play(); } catch (e) { console.warn(e); }
        }
      });
      anchor.addEventListener("targetLost", () => {
        hintEl.textContent = "Ищем открытку…";
        audioEl.pause();
      });
    </script>
  </body>
</html>
