<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Quack AR</title>
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script>
      // Keep WebGL clear alpha at 0 every frame — A-Frame often resets it to opaque black.
      AFRAME.registerComponent("transparent-canvas", {
        tick: function () {
          const r = this.el.renderer;
          if (r) r.setClearColor(0x000000, 0);
        },
      });
    </script>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      .ar-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      /* Critical: without this, transparent WebGL still shows black CSS behind pixels */
      .ar-container a-scene,
      .ar-container .a-canvas,
      .ar-container canvas {
        background: transparent !important;
        background-color: transparent !important;
      }
      #start {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: linear-gradient(160deg, #1a3a5c, #264653 50%, #2a9d8f);
        color: #fff8f0;
        font-family: Georgia, "Times New Roman", serif;
      }
      #start h1 { margin: 0; font-size: 1.8rem; font-weight: normal; }
      #start p { margin: 0; max-width: 22rem; opacity: 0.9; line-height: 1.4; }
      #start button {
        margin-top: 0.5rem;
        border: 0;
        border-radius: 999px;
        padding: 0.9rem 1.6rem;
        font-size: 1.1rem;
        cursor: pointer;
        background: #ffb703;
        color: #264653;
        font-weight: 700;
      }
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 1rem;
        z-index: 30;
        text-align: center;
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 0.9rem;
        text-shadow: 0 1px 4px #000;
        pointer-events: none;
        opacity: 0;
      }
      #hint.show { opacity: 1; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="start">
      <h1>Quack AR</h1>
      <p>Нажмите «Начать», разрешите камеру и наведите телефон на распечатанную открытку.</p>
      <button type="button" id="startBtn">Начать</button>
    </div>
    <div id="hint">Ищем открытку…</div>

    <div class="ar-container" id="arContainer">
      <a-scene
        id="scene"
        transparent-canvas
        mindar-image="imageTargetSrc: ./assets/targets.mind; uiLoading: no; uiScanning: no; uiError: yes"
        embedded
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights: true, alpha: true, antialias: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        loading-screen="enabled: false"
      >
        <a-assets>
          <a-asset-item id="duckModel" src="./assets/duck.glb"></a-asset-item>
          <audio id="track" src="./assets/duck-quack.mp3" preload="auto" loop></audio>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-light type="ambient" color="#ffffff" intensity="1.6"></a-light>
        <a-light type="directional" intensity="1.2" position="0 1 2"></a-light>

        <a-entity id="anchor" mindar-image-target="targetIndex: 0">
          <a-entity
            id="duckSpin"
            position="0 0 0.2"
            animation="property: rotation; to: 0 0 360; loop: true; dur: 7000; easing: linear"
          >
            <a-gltf-model
              id="duck"
              src="#duckModel"
              scale="0.4 0.4 0.4"
              rotation="90 0 0"
            ></a-gltf-model>
          </a-entity>
        </a-entity>
      </a-scene>
    </div>

    <script>
      const startEl = document.getElementById("start");
      const startBtn = document.getElementById("startBtn");
      const sceneEl = document.getElementById("scene");
      const hintEl = document.getElementById("hint");
      const audioEl = document.getElementById("track");
      const anchor = document.getElementById("anchor");
      const container = document.getElementById("arContainer");

      let audioReady = false;

      function revealCameraUnderCanvas() {
        // 1) Transparent WebGL clear
        const r = sceneEl.renderer;
        if (r) {
          r.setClearColor(0x000000, 0);
          if (r.domElement) {
            r.domElement.style.background = "transparent";
            r.domElement.style.backgroundColor = "transparent";
            r.domElement.style.zIndex = "2";
            r.domElement.style.position = "absolute";
          }
        }

        // 2) Transparent CSS on scene/canvas wrappers
        sceneEl.style.background = "transparent";
        container.querySelectorAll("canvas, .a-canvas").forEach((el) => {
          el.style.background = "transparent";
          el.style.backgroundColor = "transparent";
          el.style.zIndex = "2";
        });

        // 3) MindAR video is z-index:-2 by default; keep it under canvas but visible
        container.querySelectorAll("video").forEach((v) => {
          v.style.zIndex = "1";
          v.style.opacity = "1";
          v.style.visibility = "visible";
          v.style.display = "block";
          v.style.objectFit = "cover";
          v.muted = true;
          v.playsInline = true;
          v.play().catch(() => {});
        });
      }

      sceneEl.addEventListener("loaded", revealCameraUnderCanvas);
      sceneEl.addEventListener("renderstart", revealCameraUnderCanvas);
      sceneEl.addEventListener("arReady", revealCameraUnderCanvas);

      startBtn.addEventListener("click", async () => {
        startEl.classList.add("hidden");
        hintEl.classList.add("show");
        revealCameraUnderCanvas();

        try {
          audioEl.currentTime = 0;
          await audioEl.play();
          audioEl.pause();
          audioReady = true;
        } catch (e) {
          console.warn("audio unlock", e);
        }

        setTimeout(() => window.dispatchEvent(new Event("resize")), 100);
        setTimeout(revealCameraUnderCanvas, 200);
        setTimeout(revealCameraUnderCanvas, 600);
        setTimeout(revealCameraUnderCanvas, 1500);
      });

      anchor.addEventListener("targetFound", async () => {
        hintEl.textContent = "Утка найдена";
        revealCameraUnderCanvas();
        if (audioReady) {
          try { await audioEl.play(); } catch (e) { console.warn(e); }
        }
      });
      anchor.addEventListener("targetLost", () => {
        hintEl.textContent = "Ищем открытку…";
        audioEl.pause();
      });
    </script>
  </body>
</html>
